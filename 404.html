<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCA Minhag of the Week</title>
<script>
// GitHub Pages serves this file for any URL that isn't a real file (e.g.
// /sponsorship, /episode-187, /category/holidays — all client-side routes).
// Instead of duplicating the whole site here, remember the path the visitor
// actually wanted and hand off to the real, always-current index.html, which
// reads it back and restores the URL before its router runs.
sessionStorage.setItem('mow_redirect_path', location.pathname + location.search + location.hash);
location.replace('/');
</script>
</head>
<body></body>
</html>
