name: Sync transcripts

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub's fastest allowed schedule) — safety-net catch-all
  repository_dispatch:
    types: [docs-updated]    # fired instantly by the Apps Script trigger in each Google Doc on every edit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync
        run: node scripts/sync_transcripts.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync transcripts"
            git push
          else
            echo "No changes to transcripts.json"
          fi
