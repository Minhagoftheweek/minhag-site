name: Update total view count

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull view counts and update data file
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: 'PLS3KTNjJqUerF8CfHShZg1HCKhgEiaJS8'
          SPROUTVIDEO_API_KEY: ${{ secrets.SPROUTVIDEO_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python scripts/update_views.py

      - name: Commit and push if changed
        run: |
          git config user.name "view-count-bot"
          git config user.email "actions@github.com"
          git add data/view-count.json data/instagram-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update total view count"
            git push
          else
            echo "No change in view count, nothing to commit."
          fi

  targeted-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run targeted 2019-2021 scan
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SCAN_SINCE_DATE: '2019-01-01'
          SCAN_UNTIL_DATE: '2022-01-01'
        run: python scripts/targeted_instagram_scan.py
        continue-on-error: true

      - name: Commit and push scan results
        if: always()
        run: |
          git config user.name "view-count-bot"
          git config user.email "actions@github.com"
          git add data/instagram-targeted-scan.csv data/instagram-targeted-scan-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Targeted 2019-2021 Instagram scan results + log"
            git push
          else
            echo "No results to commit."
          fi
