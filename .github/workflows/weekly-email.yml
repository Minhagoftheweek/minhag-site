name: Weekly email

# Builds the Minhag of the Week email for one episode and puts it in Mailchimp.
#
# Hands-off: every 5 minutes it reads the episode tracking sheet. Any upcoming
# row with "Yes" in the "Ready for mailchimp?" column gets its email scheduled
# for that row's date at 1:00 PM New York time, and a test copy is sent.
# "23 (Old)" in Episode # = From the Archives; a plain number = new episode.
# On Wednesday it re-checks the site and refreshes the email if anything changed.
#
# By hand (Run workflow):
#   mode "test":     saves a draft and emails a test copy. Nothing goes to the list.
#   mode "schedule": schedules the episode you type for the coming Wednesday.
#   mode "auto":     does right now what the timer does (episode box is ignored).

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number (for example 23). Ignored in auto mode."
        required: false
      mode:
        description: "test = draft + test copy only; schedule = schedule for Wednesday 1:00 PM; auto = read the tracking sheet"
        type: choice
        options: [test, schedule, auto]
        default: test
      test_email:
        description: "Where to send the test copy"
        default: "vdweck1@gmail.com"
  repository_dispatch:
    types: [weekly_email]
  schedule:
    # Quick look at the tracking sheet every 5 minutes (the fastest GitHub allows).
    # It only does real work when a row's "Ready for mailchimp?" changed.
    - cron: "*/5 * * * *"
    # Wednesday before the send (11 AM, 12 PM, 1 PM New York in summer; 10 AM,
    # 11 AM, 12 PM in winter): refresh the email if the site changed. A run
    # less than 20 minutes before the send changes nothing.
    - cron: "0 15,16,17 * * 3"

permissions:
  contents: write

concurrency:
  group: weekly-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ github.event.inputs.episode || github.event.client_payload.episode }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'test' }}
      TEST_EMAIL: ${{ github.event.inputs.test_email || github.event.client_payload.test_email || 'vdweck1@gmail.com' }}
      HANDS_OFF: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'auto' || github.event.client_payload.mode == 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - name: Quick look (is there anything to do?)
        id: decide
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$CRON" = "0 15,16,17 * * 3" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/send_weekly_email.py plan >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.heavy == 'true'
        with:
          python-version: "3.12"

      - name: Install tools
        if: steps.decide.outputs.heavy == 'true'
        run: |
          pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Hands-off run (match Mailchimp to the tracking sheet, then pre-send check)
        if: steps.decide.outputs.heavy == 'true' && env.HANDS_OFF == 'true'
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python scripts/send_weekly_email.py weekly --test-email "vdweck1@gmail.com"

      - name: Build images and PDF
        if: env.HANDS_OFF != 'true'
        run: python scripts/send_weekly_email.py prepare "$EPISODE"

      - name: Publish images and PDF to the site
        if: env.HANDS_OFF != 'true'
        run: |
          git add images/email transcripts/pdf
          if ! git diff --cached --quiet; then
            git commit -m "Weekly email assets for episode $EPISODE"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep 5
            done
          else
            echo "Assets already published"
          fi

      - name: Create the email in Mailchimp
        if: env.HANDS_OFF != 'true'
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python scripts/send_weekly_email.py send "$EPISODE" --mode "$MODE" --test-email "$TEST_EMAIL"

      - name: Save the run log
        if: always() && steps.decide.outputs.heavy == 'true'
        run: |
          git add logs/weekly-email.log logs/weekly-email-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Weekly email log"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
