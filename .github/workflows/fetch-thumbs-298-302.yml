name: Fetch thumbnails for Ep 298-302 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-thumbs-298-302.yml

permissions:
  contents: write

jobs:
  fetch-thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download THUMBS images and verify JPEGs
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          html = open("index.html", encoding="utf-8").read()
          thumbs = json.loads(re.search(r"const THUMBS=(\{.*?\});", html, re.S).group(1))
          for n in range(298, 303):
              url = thumbs[str(n)]
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp:
                  data = resp.read()
              if not (data[:3] == b"\xff\xd8\xff" and data[-2:] == b"\xff\xd9" and len(data) > 5000):
                  raise SystemExit(f"Ep {n}: not a valid JPEG ({len(data)} bytes) from {url}")
              path = f"images/episode-{n}-thumb.jpg"
              with open(path, "wb") as f:
                  f.write(data)
              print(f"Ep {n}: {path} ({len(data)} bytes)")
          PY
          file images/episode-29[89]-thumb.jpg images/episode-30[012]-thumb.jpg

      - name: Commit images and remove this workflow
        run: |
          git config user.name "minhag-publish-bot"
          git config user.email "actions@github.com"
          git add images/episode-298-thumb.jpg images/episode-299-thumb.jpg images/episode-300-thumb.jpg images/episode-301-thumb.jpg images/episode-302-thumb.jpg
          git rm .github/workflows/fetch-thumbs-298-302.yml
          git commit -m "Self-host link-preview thumbnails for Ep 298-302"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
